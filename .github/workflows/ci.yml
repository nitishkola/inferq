name: ci
on: [push, pull_request]

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      # Run through bash so the test doesn't depend on the file's executable bit
      # (it is lost when the repo is committed from Windows).
      - run: bash tests/lua/run_tests.sh

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r worker/requirements-dev.txt
      - run: cd worker && pytest -q

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: cd api && mvn -B verify
