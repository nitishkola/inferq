global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]
  - job_name: worker
    # Finds every worker replica through Docker's DNS, so scaling needs no config change.
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
